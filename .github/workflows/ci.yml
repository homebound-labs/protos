name: ci

on:
  push:
    branches: [main]
  pull_request:

# Every codegen tool is pinned. An unpinned plugin silently changes the
# generated output the moment upstream releases, which turns the
# "Regenerate and diff" step red on a PR that did not touch protos. Bump
# these deliberately, in a PR that also commits the regenerated output.
env:
  BUF_VERSION: "1.72.0"
  PROTOC_VERSION: "29.3"
  PROTOC_GEN_GO_VERSION: "v1.36.11"

jobs:
  lint-and-verify-generated:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: Install buf
        uses: bufbuild/buf-setup-action@v1
        with:
          version: ${{ env.BUF_VERSION }}

      - name: Install protoc-gen-go
        run: go install google.golang.org/protobuf/cmd/protoc-gen-go@${{ env.PROTOC_GEN_GO_VERSION }}

      - name: Install protoc (for Python codegen)
        run: |
          curl -sSL -o /tmp/protoc.zip \
            "https://github.com/protocolbuffers/protobuf/releases/download/v${PROTOC_VERSION}/protoc-${PROTOC_VERSION}-linux-x86_64.zip"
          sudo unzip -o /tmp/protoc.zip -d /usr/local

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # package.json pins protoc-gen-es to an exact version, so this is
      # reproducible without committing a lockfile.
      - name: Install protoc-gen-es (for TypeScript codegen)
        run: npm install --no-audit --no-fund

      - name: buf lint
        run: buf lint

      - name: buf breaking (against main)
        if: github.event_name == 'pull_request'
        run: buf breaking --against 'https://github.com/homebound-labs/protos.git#branch=main'

      - name: Regenerate and diff
        run: |
          export PATH="$PATH:$(go env GOPATH)/bin"
          ./scripts/generate.sh
          git diff --exit-code -- gen/

      - name: go build
        run: go build ./...

      # Imports every generated module, not a hand-picked couple. A module
      # generated by a mismatched protoc fails its runtime-version check at
      # import time, and only a full sweep catches it.
      - name: Python install and import check
        run: |
          python3 -m venv /tmp/venv
          /tmp/venv/bin/pip install --quiet ./gen/python
          /tmp/venv/bin/python3 - <<'PY'
          import importlib, pathlib, sys

          # Scoped to the package root on purpose: `pip install` leaves
          # setuptools artifacts in gen/python/build/, and globbing the whole
          # of gen/python would try to import those copies as `build.lib.*`.
          root = pathlib.Path("gen/python")
          modules = sorted(
              str(p.relative_to(root).with_suffix("")).replace("/", ".")
              for p in (root / "homebound").rglob("*_pb2.py")
          )
          if not modules:
              sys.exit("no generated Python modules found")
          for name in modules:
              importlib.import_module(name)
              print("ok:", name)
          PY

      - name: TypeScript build check
        run: npx --yes -p typescript tsc --noEmit --target es2020 --module commonjs --moduleResolution node --skipLibCheck $(find gen/ts -name '*_pb.ts')
