[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "homebound-protos"
version = "0.1.0"
description = "Generated Python protobuf bindings for Homebound Labs shared schemas (github.com/homebound-labs/protos)"
requires-python = ">=3.11"
dependencies = [
  "protobuf>=5.29,<6.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["homebound*"]
