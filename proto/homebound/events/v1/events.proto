syntax = "proto3";

package homebound.events.v1;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/homebound-labs/protos/gen/go/homebound/events/v1;eventsv1";

// DistanceAlertEvent is reserved for a future shared event-bus contract when
// backend-api's phone/device distance alert evaluation moves off in-process
// evaluation onto a message bus. Not wired into any transport yet; included
// so the events package has a real first message rather than an empty
// placeholder.
message DistanceAlertEvent {
  string alert_id = 1;
  string user_id = 2;
  string device_id = 3;
  string severity = 4;
  double distance_miles = 5;
  google.protobuf.Timestamp created_at = 6;
}
